[package]
name = "momr"
version = "1.1.1"
edition = "2024"

[workspace]
members = [".", "crates/momr-core", "crates/momr-platform"]

[dependencies]
momr-core = { path = "crates/momr-core" }
momr-platform = { path = "crates/momr-platform" }
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_6"] }
async-channel = "2.5.0"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
libc = "0.2.189"
serde_json = "1.0.151"

[features]
default = []
# GPU transcription through whisper.cpp's Metal backend, for Apple silicon and
# recent Intel Macs. Needs nothing beyond the Xcode command line tools.
metal = ["momr-core/metal"]
